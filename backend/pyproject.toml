[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modulus"
version = "0.2.0"
description = "Modulus — Python structural design engine that screens and recommends beam/bracket designs by factor of safety, weight, and cost, validated against an independent finite-element solver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aaditya Gupta" }]
keywords = ["mechanical-engineering", "structural-analysis", "optimization", "finite-element", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "plotly>=5.18",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.urls]
Homepage = "https://github.com/Aaditya-Gupta24/Modulus"
Repository = "https://github.com/Aaditya-Gupta24/Modulus"

[tool.setuptools]
packages = ["modulus", "modulus.visuals", "validation"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
