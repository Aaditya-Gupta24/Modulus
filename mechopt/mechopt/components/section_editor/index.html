<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Section Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
    color: #fafafa;
  }
  .editor-container {
    display: flex;
    gap: 24px;
    padding: 16px;
    align-items: flex-start;
  }
  .svg-panel {
    flex: 1;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .svg-panel svg {
    max-width: 100%;
    height: auto;
  }
  .controls-panel {
    flex: 0 0 220px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .dim-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .dim-group label {
    font-size: 0.72rem;
    color: #a0a4b0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .dim-group input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #3d4050;
    border-radius: 6px;
    background: #1a1d24;
    color: #fafafa;
    font-size: 0.85rem;
    outline: none;
  }
  .dim-group input:focus {
    border-color: #4a9eff;
  }
  .results-bar {
    display: flex;
    gap: 16px;
    padding: 10px 16px;
    background: #1a1d24;
    border: 1px solid #3d4050;
    border-radius: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .result-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .result-label {
    font-size: 0.65rem;
    color: #a0a4b0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .result-value {
    font-size: 1rem;
    font-weight: 700;
  }
  .section-title {
    font-size: 0.8rem;
    color: #a0a4b0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-align: center;
  }
  /* Drag handle styling */
  .drag-handle {
    cursor: grab;
  }
  .drag-handle:active {
    cursor: grabbing;
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
// ── Streamlit Component Protocol ────────────────────────────────────────────

// Signal readiness
window.parent.postMessage({
  isStreamlitMessage: true,
  type: "streamlit:componentReady",
  apiVersion: 1
}, "*");

// Current state
let currentArgs = null;
let dragState = null;

// Listen for render events from Streamlit
window.addEventListener("message", function(event) {
  if (!event.data || event.data.type !== "streamlit:render") return;
  currentArgs = event.data.args;
  render(currentArgs);
});

function setFrameHeight() {
  const h = document.getElementById("root").scrollHeight + 20;
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: h
  }, "*");
}

function sendValue(dims) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: dims
  }, "*");
}

// ── Rendering ───────────────────────────────────────────────────────────────

function render(args) {
  if (!args) return;
  var section = args.section || "rectangle";
  var dims = args.dims || {};
  var results = args.results || {};

  var root = document.getElementById("root");

  // Build the SVG for the section
  var svgContent = buildSVG(section, dims, results.safe);

  // Build dimension inputs
  var inputsHTML = buildInputs(section, dims);

  // Build results bar
  var fos = results.fos != null ? results.fos.toFixed(2) : "--";
  var stress = results.stress != null ? (results.stress / 1e6).toFixed(1) : "--";
  var defl = results.deflection != null ? (results.deflection * 1e3).toFixed(2) : "--";
  var safeText = results.safe ? "SAFE" : "UNSAFE";
  var safeColor = results.safe ? "#28a745" : "#dc3545";

  root.innerHTML =
    '<div class="editor-container">' +
      '<div class="svg-panel">' +
        '<div class="section-title">' + section.replace(/_/g, " ") + '</div>' +
        svgContent +
        '<div class="results-bar">' +
          '<div class="result-item"><span class="result-label">FoS</span><span class="result-value" style="color:' + safeColor + '">' + fos + '</span></div>' +
          '<div class="result-item"><span class="result-label">Stress</span><span class="result-value">' + stress + ' MPa</span></div>' +
          '<div class="result-item"><span class="result-label">Deflection</span><span class="result-value">' + defl + ' mm</span></div>' +
          '<div class="result-item"><span class="result-label">Status</span><span class="result-value" style="color:' + safeColor + '">' + safeText + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="controls-panel">' +
        inputsHTML +
      '</div>' +
    '</div>';

  // Attach drag handlers to SVG handles
  attachDragHandlers(section, dims);

  // Attach input change handlers
  attachInputHandlers(section, dims);

  setTimeout(setFrameHeight, 50);
}

// ── SVG builders ────────────────────────────────────────────────────────────

var SVG_W = 280;
var SVG_H = 260;
var MARGIN = 40;

function buildSVG(section, dims, safe) {
  var strokeColor = safe ? "#28a745" : "#dc3545";
  var fillColor = safe ? "rgba(40,167,69,0.08)" : "rgba(220,53,69,0.08)";

  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + SVG_W + '" height="' + SVG_H + '" viewBox="0 0 ' + SVG_W + ' ' + SVG_H + '">';
  svg += '<rect width="' + SVG_W + '" height="' + SVG_H + '" fill="transparent"/>';

  switch (section) {
    case "rectangle":
      svg += svgRectangle(dims, strokeColor, fillColor);
      break;
    case "circle":
      svg += svgCircle(dims, strokeColor, fillColor);
      break;
    case "hollow_circle":
      svg += svgHollowCircle(dims, strokeColor, fillColor);
      break;
    case "square_tube":
      svg += svgSquareTube(dims, strokeColor, fillColor);
      break;
    case "i_beam":
      svg += svgIBeam(dims, strokeColor, fillColor);
      break;
    case "hollow_rectangle":
      svg += svgHollowRectangle(dims, strokeColor, fillColor);
      break;
    default:
      svg += '<text x="' + SVG_W/2 + '" y="' + SVG_H/2 + '" fill="#a0a4b0" text-anchor="middle" font-size="14">Unsupported section</text>';
  }

  svg += '</svg>';
  return svg;
}

function dimLabel(x, y, text) {
  return '<text x="' + x + '" y="' + y + '" fill="#a0a4b0" font-size="11" text-anchor="middle" font-family="monospace">' + text + '</text>';
}

function dimLine(x1, y1, x2, y2) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#606080" stroke-width="1" stroke-dasharray="4,3"/>';
}

function dragCircle(cx, cy, id) {
  return '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#4a9eff" fill-opacity="0.7" stroke="#4a9eff" stroke-width="1.5" class="drag-handle" data-handle="' + id + '" style="cursor:grab;"/>';
}

function mm(val) {
  return (val * 1000).toFixed(1);
}

function svgRectangle(dims, stroke, fill) {
  var b = dims.b || 0.03, h = dims.h || 0.03;
  var maxDim = Math.max(b, h);
  var scale = (SVG_H - 2 * MARGIN) / maxDim;
  var rw = b * scale, rh = h * scale;
  var x0 = (SVG_W - rw) / 2, y0 = (SVG_H - rh) / 2;

  var s = '<rect x="' + x0 + '" y="' + y0 + '" width="' + rw + '" height="' + rh + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';
  // b dimension line (bottom)
  s += dimLine(x0, y0 + rh + 15, x0 + rw, y0 + rh + 15);
  s += dimLabel(x0 + rw/2, y0 + rh + 28, 'b=' + mm(b) + ' mm');
  // h dimension line (right)
  s += dimLine(x0 + rw + 15, y0, x0 + rw + 15, y0 + rh);
  s += dimLabel(x0 + rw + 38, y0 + rh/2 + 4, 'h=' + mm(h) + ' mm');
  // Drag handles
  s += dragCircle(x0 + rw, y0 + rh/2, 'b');
  s += dragCircle(x0 + rw/2, y0 + rh, 'h');
  return s;
}

function svgCircle(dims, stroke, fill) {
  var d = dims.d || 0.03;
  var scale = (SVG_H - 2 * MARGIN) / d;
  var r = d * scale / 2;
  var cx = SVG_W / 2, cy = SVG_H / 2;

  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';
  // diameter line
  s += dimLine(cx - r, cy, cx + r, cy);
  s += dimLabel(cx, cy - r - 12, 'd=' + mm(d) + ' mm');
  // Drag handle
  s += dragCircle(cx + r, cy, 'd');
  return s;
}

function svgHollowCircle(dims, stroke, fill) {
  var d = dims.d || 0.05, di = dims.di || 0.042;
  var scale = (SVG_H - 2 * MARGIN) / d;
  var ro = d * scale / 2, ri = di * scale / 2;
  var cx = SVG_W / 2, cy = SVG_H / 2;

  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + ro + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ri + '" fill="#0e1117" stroke="' + stroke + '" stroke-width="1.5" stroke-dasharray="4,2"/>';
  // outer diameter
  s += dimLine(cx - ro, cy - ro - 10, cx + ro, cy - ro - 10);
  s += dimLabel(cx, cy - ro - 22, 'd=' + mm(d) + ' mm');
  // inner diameter
  s += dimLine(cx - ri, cy + 5, cx + ri, cy + 5);
  s += dimLabel(cx, cy + 18, 'di=' + mm(di) + ' mm');
  // Drag handles
  s += dragCircle(cx + ro, cy, 'd');
  s += dragCircle(cx + ri, cy, 'di');
  return s;
}

function svgSquareTube(dims, stroke, fill) {
  var a = dims.a || 0.04, w = dims.w || 0.004;
  var scale = (SVG_H - 2 * MARGIN) / a;
  var side = a * scale, wall = w * scale;
  var x0 = (SVG_W - side) / 2, y0 = (SVG_H - side) / 2;

  var s = '<rect x="' + x0 + '" y="' + y0 + '" width="' + side + '" height="' + side + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';
  s += '<rect x="' + (x0 + wall) + '" y="' + (y0 + wall) + '" width="' + (side - 2*wall) + '" height="' + (side - 2*wall) + '" fill="#0e1117" stroke="' + stroke + '" stroke-width="1.5" stroke-dasharray="4,2"/>';
  // a dimension
  s += dimLine(x0, y0 + side + 15, x0 + side, y0 + side + 15);
  s += dimLabel(x0 + side/2, y0 + side + 28, 'a=' + mm(a) + ' mm');
  // w dimension (wall)
  s += dimLine(x0, y0 - 8, x0 + wall, y0 - 8);
  s += dimLabel(x0 + wall/2, y0 - 18, 'w=' + mm(w) + ' mm');
  // Drag handles
  s += dragCircle(x0 + side, y0 + side/2, 'a');
  s += dragCircle(x0 + wall, y0, 'w');
  return s;
}

function svgIBeam(dims, stroke, fill) {
  var b = dims.b || 0.05, h = dims.h || 0.05;
  var tf = dims.tf || 0.005, tw = dims.tw || 0.005;
  var maxDim = Math.max(b, h);
  var scale = (SVG_H - 2 * MARGIN) / maxDim;
  var bPx = b * scale, hPx = h * scale;
  var tfPx = tf * scale, twPx = tw * scale;
  var x0 = (SVG_W - bPx) / 2, y0 = (SVG_H - hPx) / 2;
  var webX = (SVG_W - twPx) / 2;

  // I-beam as a polygon path: top flange -> right web -> bottom flange -> left web
  var pts = [
    x0, y0,                           // top-left of top flange
    x0 + bPx, y0,                     // top-right of top flange
    x0 + bPx, y0 + tfPx,             // bottom-right of top flange
    webX + twPx, y0 + tfPx,          // right web top
    webX + twPx, y0 + hPx - tfPx,    // right web bottom
    x0 + bPx, y0 + hPx - tfPx,       // top-right of bottom flange
    x0 + bPx, y0 + hPx,              // bottom-right of bottom flange
    x0, y0 + hPx,                     // bottom-left of bottom flange
    x0, y0 + hPx - tfPx,             // top-left of bottom flange
    webX, y0 + hPx - tfPx,           // left web bottom
    webX, y0 + tfPx,                 // left web top
    x0, y0 + tfPx                    // bottom-left of top flange
  ];

  var s = '<polygon points="' + pts.join(',') + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2" stroke-linejoin="round"/>';
  // b dimension (bottom)
  s += dimLine(x0, y0 + hPx + 15, x0 + bPx, y0 + hPx + 15);
  s += dimLabel(x0 + bPx/2, y0 + hPx + 28, 'b=' + mm(b) + ' mm');
  // h dimension (right)
  s += dimLine(x0 + bPx + 15, y0, x0 + bPx + 15, y0 + hPx);
  s += dimLabel(x0 + bPx + 38, y0 + hPx/2 + 4, 'h=' + mm(h) + ' mm');
  // tf label (top flange)
  s += dimLine(x0 - 15, y0, x0 - 15, y0 + tfPx);
  s += dimLabel(x0 - 30, y0 + tfPx/2 + 4, 'tf');
  // tw label (web)
  s += dimLabel(SVG_W/2, y0 + hPx/2, 'tw');
  // Drag handles
  s += dragCircle(x0 + bPx, y0 + hPx/2, 'b');
  s += dragCircle(x0 + bPx/2, y0 + hPx, 'h');
  return s;
}

function svgHollowRectangle(dims, stroke, fill) {
  var b = dims.b || 0.04, h = dims.h || 0.06, w = dims.w || 0.004;
  var maxDim = Math.max(b, h);
  var scale = (SVG_H - 2 * MARGIN) / maxDim;
  var bPx = b * scale, hPx = h * scale, wPx = w * scale;
  var x0 = (SVG_W - bPx) / 2, y0 = (SVG_H - hPx) / 2;

  var s = '<rect x="' + x0 + '" y="' + y0 + '" width="' + bPx + '" height="' + hPx + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"/>';
  s += '<rect x="' + (x0 + wPx) + '" y="' + (y0 + wPx) + '" width="' + (bPx - 2*wPx) + '" height="' + (hPx - 2*wPx) + '" fill="#0e1117" stroke="' + stroke + '" stroke-width="1.5" stroke-dasharray="4,2"/>';
  // b dimension
  s += dimLine(x0, y0 + hPx + 15, x0 + bPx, y0 + hPx + 15);
  s += dimLabel(x0 + bPx/2, y0 + hPx + 28, 'b=' + mm(b) + ' mm');
  // h dimension
  s += dimLine(x0 + bPx + 15, y0, x0 + bPx + 15, y0 + hPx);
  s += dimLabel(x0 + bPx + 38, y0 + hPx/2 + 4, 'h=' + mm(h) + ' mm');
  // w dimension
  s += dimLine(x0, y0 - 8, x0 + wPx, y0 - 8);
  s += dimLabel(x0 + wPx/2, y0 - 18, 'w=' + mm(w) + ' mm');
  // Drag handles
  s += dragCircle(x0 + bPx, y0 + hPx/2, 'b');
  s += dragCircle(x0 + bPx/2, y0 + hPx, 'h');
  return s;
}

// ── Input builders ──────────────────────────────────────────────────────────

function buildInputs(section, dims) {
  var fields = getDimFields(section);
  var html = '';
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i];
    var val = dims[f.key] != null ? (dims[f.key] * 1000).toFixed(1) : "0";
    html += '<div class="dim-group">';
    html += '<label>' + f.label + ' (mm)</label>';
    html += '<input type="number" step="0.5" min="0.5" data-dim="' + f.key + '" value="' + val + '"/>';
    html += '</div>';
  }
  return html;
}

function getDimFields(section) {
  switch (section) {
    case "rectangle":
      return [{key:"b", label:"Width b"}, {key:"h", label:"Height h"}];
    case "circle":
      return [{key:"d", label:"Diameter d"}];
    case "hollow_circle":
      return [{key:"d", label:"Outer d"}, {key:"di", label:"Inner di"}];
    case "square_tube":
      return [{key:"a", label:"Side a"}, {key:"w", label:"Wall w"}];
    case "i_beam":
      return [{key:"b", label:"Flange b"}, {key:"h", label:"Height h"}, {key:"tf", label:"Flange tf"}, {key:"tw", label:"Web tw"}];
    case "hollow_rectangle":
      return [{key:"b", label:"Width b"}, {key:"h", label:"Height h"}, {key:"w", label:"Wall w"}];
    default:
      return [];
  }
}

// ── Input handlers ──────────────────────────────────────────────────────────

function attachInputHandlers(section, dims) {
  var inputs = document.querySelectorAll('input[data-dim]');
  for (var i = 0; i < inputs.length; i++) {
    inputs[i].addEventListener('change', function() {
      var newDims = collectDimsFromInputs(section, dims);
      if (newDims) sendValue(newDims);
    });
    inputs[i].addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        var newDims = collectDimsFromInputs(section, dims);
        if (newDims) sendValue(newDims);
      }
    });
  }
}

function collectDimsFromInputs(section, oldDims) {
  var newDims = {};
  var fields = getDimFields(section);
  for (var i = 0; i < fields.length; i++) {
    var input = document.querySelector('input[data-dim="' + fields[i].key + '"]');
    if (!input) return null;
    var val = parseFloat(input.value);
    if (isNaN(val) || val <= 0) return null;
    newDims[fields[i].key] = val / 1000; // mm -> m
  }
  return newDims;
}

// ── Drag handlers ───────────────────────────────────────────────────────────

function attachDragHandlers(section, dims) {
  var handles = document.querySelectorAll('.drag-handle');
  for (var i = 0; i < handles.length; i++) {
    handles[i].addEventListener('mousedown', function(e) {
      e.preventDefault();
      var dimKey = this.getAttribute('data-handle');
      dragState = {
        dimKey: dimKey,
        startX: e.clientX,
        startY: e.clientY,
        startVal: dims[dimKey] || 0.03,
        section: section,
        dims: Object.assign({}, dims)
      };
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
    });
  }
}

function onDragMove(e) {
  if (!dragState) return;
  var dx = e.clientX - dragState.startX;
  var dy = e.clientY - dragState.startY;

  // Use the larger absolute delta; scale: ~1px = 0.2mm
  var delta;
  var key = dragState.dimKey;
  if (key === 'h' || key === 'di') {
    delta = dy * 0.0002; // vertical dims
  } else {
    delta = dx * 0.0002; // horizontal dims
  }

  var newVal = Math.max(0.001, dragState.startVal + delta);
  // Snap to 0.5mm
  newVal = Math.round(newVal * 2000) / 2000;

  var newDims = Object.assign({}, dragState.dims);
  newDims[key] = newVal;

  // Update the input field live
  var input = document.querySelector('input[data-dim="' + key + '"]');
  if (input) input.value = (newVal * 1000).toFixed(1);
}

function onDragEnd(e) {
  if (!dragState) return;
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);

  // Send final value
  var newDims = collectDimsFromInputs(dragState.section, dragState.dims);
  dragState = null;
  if (newDims) sendValue(newDims);
}
</script>
</body>
</html>
